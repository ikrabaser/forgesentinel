# Minimal Eclipse Mosquitto broker config for the local ForgeSentinel
# lab. Deliberately unauthenticated - the same honest trade-off the
# Modbus server documents in mapping.py's docstring: this reproduces a
# real, extremely common OT/IoT deployment mistake (a broker exposed
# with no credentials, trusting network position instead) rather than
# hiding it behind auth that would make MQTT's own security posture
# look better than it typically is in the field. Never expose this
# configuration outside an isolated lab network.

listener 1883
allow_anonymous true

# No persistence needed - this is disposable simulator traffic, not a
# system of record (that's Postgres's job).
persistence false
