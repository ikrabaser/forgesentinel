services:
  postgres:
    image: postgres:16-alpine
    container_name: forgesentinel-postgres
    environment:
      POSTGRES_USER: forgesentinel
      POSTGRES_PASSWORD: forgesentinel
      POSTGRES_DB: forgesentinel
    ports:
      - "5432:5432"
    volumes:
      - forgesentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesentinel -d forgesentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgesentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: forgesentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: forgesentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-forgesentinel}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - forgesentinel_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: forgesentinel-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Milestone 12: offline PCAP analysis, not always-on services - see
  # network-security/README.md for why (Docker Desktop on Windows
  # can't live-sniff the collector's loopback traffic). The
  # "analysis" profile keeps these out of a plain `docker compose up`;
  # run them explicitly with `docker compose --profile analysis run --rm <name>`.
  suricata:
    image: jasonish/suricata:latest
    container_name: forgesentinel-suricata
    profiles: ["analysis"]
    volumes:
      - ./network-security/pcaps:/pcaps:ro
      - ./network-security/suricata/rules:/rules:ro
      - ./network-security/suricata/logs:/var/log/suricata
    entrypoint:
      [
        "suricata",
        "-r", "/pcaps/malicious-write.pcap",
        "-l", "/var/log/suricata",
        "-S", "/rules/forgesentinel-modbus.rules",
        "--set", "app-layer.protocols.modbus.enabled=yes",
        "--set", "app-layer.protocols.modbus.detection-ports.dp=5020",
      ]

  zeek:
    image: zeek/zeek:latest
    container_name: forgesentinel-zeek
    profiles: ["analysis"]
    working_dir: /logs
    volumes:
      - ./network-security/pcaps:/pcaps:ro
      - ./network-security/zeek/local.zeek:/local.zeek:ro
      - ./network-security/zeek/logs:/logs
    entrypoint: ["zeek", "-C", "-r", "/pcaps/malicious-write.pcap", "/local.zeek"]

volumes:
  forgesentinel_pgdata:
  forgesentinel_grafana_data:
