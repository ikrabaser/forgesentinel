services:
  postgres:
    image: postgres:16-alpine
    container_name: forgesentinel-postgres
    environment:
      POSTGRES_USER: forgesentinel
      POSTGRES_PASSWORD: forgesentinel
      POSTGRES_DB: forgesentinel
    ports:
      - "5432:5432"
    volumes:
      - forgesentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesentinel -d forgesentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgesentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: forgesentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: forgesentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-forgesentinel}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - forgesentinel_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  forgesentinel_pgdata:
  forgesentinel_grafana_data:
