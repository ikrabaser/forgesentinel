# Prometheus scrape configuration.
#
# Targets use host.docker.internal because the backend and collector
# run directly on the host machine (this is a local dev lab, not a
# containerized deployment of the app itself) while Prometheus runs
# inside Docker via docker-compose.yml. Docker Desktop resolves
# host.docker.internal to the host automatically on Windows/Mac - no
# extra config needed for this local setup.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "forgesentinel-backend"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "forgesentinel-collector"
    static_configs:
      - targets: ["host.docker.internal:9100"]
